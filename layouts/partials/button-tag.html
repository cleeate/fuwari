{{/* ButtonTag.astro. Context: dict "href" "label" "dot" "content" */}}
<a href="{{ .href }}" aria-label="{{ .label }}" class="btn-regular h-8 text-sm px-3 rounded-lg">
{{- if .dot }}<div class="h-1 w-1 bg-[var(--btn-content)] dark:bg-[var(--card-bg)] transition rounded-md mr-2"></div>{{ end }}
{{ .content }}
</a>
