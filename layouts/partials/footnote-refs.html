{{/* Rewrite Goldmark's footnote references into remark-gfm's form (dist). */}}
{{- $c := . -}}
{{- $c = replaceRE `<sup id="fnref:(\d+)"><a href="#fn:(\d+)" class="footnote-ref" role="doc-noteref">(\d+)</a></sup>` `<sup><a href="#user-content-fn-$2" id="user-content-fnref-$1" data-footnote-ref="" aria-describedby="footnote-label">$3</a></sup>` $c -}}
{{- return $c -}}
