{{/* SideBar.astro */}}
<div id="sidebar" class="mb-4 row-start-2 row-end-3 col-span-2 lg:row-start-1 lg:row-end-2 lg:col-span-1 lg:max-w-[17.5rem] onload-animation w-full">
<div class="flex flex-col w-full gap-4 mb-4">
{{ partial "profile.html" . }}
</div>
<div id="sidebar-sticky" class="transition-all duration-700 flex flex-col w-full gap-4 top-4 sticky top-4">
{{ partial "categories.html" (dict "page" . "class" "onload-animation" "style" "animation-delay: 150ms") }}
{{ partial "tags.html" (dict "page" . "class" "onload-animation" "style" "animation-delay: 200ms") }}
</div>
</div>
